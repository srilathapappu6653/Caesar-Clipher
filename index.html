<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Caesar Cipher</h1>
        <p>Encrypt or decrypt your message using a Caesar shift.</p>

        <form method="POST">
            <label for="text">Enter text:</label>
            <textarea name="text" id="text" placeholder="Enter your message..." required>{{ text }}</textarea>

            <label for="shift">Shift value:</label>
            <input type="number" name="shift" id="shift" value="{{ shift }}" required>

            <div class="buttons">
                <button type="submit" name="action" value="encrypt">Encrypt</button>
                <button type="submit" name="action" value="decrypt">Decrypt</button>
            </div>
        </form>

        {% if result %}
        <div class="result">
            <h2>Result</h2>
            <p>{{ result }}</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
